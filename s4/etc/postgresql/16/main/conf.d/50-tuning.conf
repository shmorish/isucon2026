max_connections = 200

# よく読むデータ（realmojis 580MB、posts 342MB、comments 161MB、image_objects の heap とインデックス 408MB、計 約1.5GB）が
# 1GB に収まらず、画像メタや realmojis の一覧がディスクを読んでいた（ヒット率 82〜95%）。s4 のメモリ使用は最大 57%。
# アプリの pool は s1 60 + s2・s3 各 10 で、1本 約10MB として足りる。変更には再起動が要る（task deploy が pending_restart を見て1回だけ再起動する）
shared_buffers = 1600MB
effective_cache_size = 2560MB
work_mem = 16MB
maintenance_work_mem = 256MB
# autovacuum の3ワーカーがそれぞれ maintenance_work_mem を取ると swap なしの 3.7GiB では厳しい
autovacuum_work_mem = 64MB

random_page_cost = 1.1
effective_io_concurrency = 200
# 大きいテーブルの seq scan で JIT のコンパイル時間 (数十〜数百 ms) が毎回乗るため
jit = off
# 2 コアを 60 本の接続で使い切っているので、並列ワーカーを起こしても取り合いになるだけ (#74)
# 主要クエリの EXPLAIN に Gather はなく、CREATE INDEX の並列 (max_parallel_maintenance_workers) は別で残る
max_parallel_workers_per_gather = 0

# ベンチ 1 回の WAL は約 1GB で max_wal_size には届かない。時限 checkpoint がベンチ中に入ると
# その後の full page write (lz4 圧縮) が増えるので、再起動から 30 分はベンチ中に来ないようにする (#74)
checkpoint_timeout = 30min
max_wal_size = 4GB
min_wal_size = 1GB
