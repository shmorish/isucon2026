max_connections = 200

shared_buffers = 1GB
effective_cache_size = 2560MB
work_mem = 16MB
maintenance_work_mem = 256MB
# autovacuum の3ワーカーがそれぞれ maintenance_work_mem を取ると swap なしの 3.7GiB では厳しい
autovacuum_work_mem = 64MB

random_page_cost = 1.1
effective_io_concurrency = 200
# 大きいテーブルの seq scan で JIT のコンパイル時間 (数十〜数百 ms) が毎回乗るため
jit = off

checkpoint_timeout = 15min
max_wal_size = 4GB
min_wal_size = 1GB
