# pg_prewarm は計測用ではない（17:00 以降も消さない）。autoprewarm が shared_buffers の中身を
# 終了時と5分ごとに保存し、起動時に読み戻す。再起動後の追試で画像や投稿のページがディスク待ちになるのを防ぐ
shared_preload_libraries = 'pg_prewarm,pg_stat_statements'
pg_stat_statements.track = top
pg_stat_statements.track_utility = off
track_io_timing = on

# 画像の bytea パラメータが 1 行 1MB 超でログに丸ごと出るのを防ぐ
log_parameter_max_length = 256
log_lock_waits = on
