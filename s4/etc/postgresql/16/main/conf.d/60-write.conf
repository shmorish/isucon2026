# 632d9fe (#38) の書き込み設定を PostgreSQL の既定値に戻した (#50)
# 632d9fe の後のベンチで、投稿作成の INSERT が平均 16ms → 114ms に悪化したため
# deploy は消したファイルを /etc から消さないので、ファイルは残して値を既定に戻す
# wal_buffers の変更は再起動が必要: task deploy が pending_restart を見て PostgreSQL を1回だけ再起動する
wal_buffers = -1

bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# commit の WAL 書き込み待ち (LWLock:WALWrite) が DB の中でいちばん多い待ちになった (#70)
# それでも commit が slp の1位（7,538回 × 平均79ms = 597秒）だったので、commit で fsync を待たない (#80)
# 失うのは OS クラッシュ時の直近 約0.6秒（wal_writer_delay の3倍）だけ。正常な停止・再起動では WAL を書き出してから止まる
synchronous_commit = off
# fsync を待たないので、まとめるための待ちは不要
commit_delay = 0
commit_siblings = 5
# checkpoint 後の full page write を lz4 で縮めて WAL を減らす（画像本体の JPEG は縮まないが、インデックスや users などのページは縮む）
wal_compression = lz4
