# 投稿作成の INSERT (画像込み) の書き込み待ちを減らす (#38)。fsync / synchronous_commit / full_page_writes は変えない
# 12:01 のベンチ: pg_stat_wal の wal_buffers_full 1.4M (WAL バッファがあふれ、バックエンドが自分で WAL を書いていた)
# 既定 (shared_buffers/32 = 16MB の上限) から増やす。共有メモリが 48MB 増えるだけ (s4 は available 約1.2GB)
# 再起動が必要な設定: 入れた直後の task deploy で PostgreSQL が1回だけ再起動する (pending_restart を見て判断)
wal_buffers = 64MB

# pg_stat_bgwriter: buffers_backend 7.7M ≫ buffers_checkpoint 247k、maxwritten_clean 7544 (bgwriter が1回の上限で止まっていた)
# バックエンドが汚れたページを自分で書き出してから空きバッファを得るのを減らす。reload で反映される
bgwriter_delay = 20ms
bgwriter_lru_maxpages = 1000
bgwriter_lru_multiplier = 4
