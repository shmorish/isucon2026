# 計測用: 10ms 以上のクエリを /var/log/postgresql/postgresql-16-main.log に出す (task slp で集計)
# 0 (全件) は pgx が1クエリで bind と execute の2行を出し、ベンチ2回で 460MB・s4 の CPU を食ったのでやめた。全件の集計は task pgstat
# 17:00 以降は log_min_duration_statement = -1 に戻す (task deploy の reload で反映され、再起動しない)
log_min_duration_statement = -1
log_line_prefix = '%m [%p] '
