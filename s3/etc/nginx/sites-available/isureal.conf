# 署名の依頼はこのサーバーのアプリ、画像を含むそれ以外の /api は DB の隣の s1 のアプリで処理する。
# s1 では DB との往復が 1ms なので、ここから DB に何往復もする（1往復 100ms）より速い。
# 転送はルーター経由（s1 まで往復 100ms）のままで、遅延・帯域制限は迂回しない
upstream app {
  server 127.0.0.1:8080;
  keepalive 64;
}

upstream s1app {
  server 192.168.1.10:8080;
  keepalive 64;
}

# 画像は s1 の nginx に送る。s1 の nginx を通るとアプリは確認だけして、ファイルは nginx が sendfile で返す（X-Accel-Redirect、#76）。
# s1 の nginx が付ける X-Isureal-Region asia は画像では使われない
upstream s1nginx {
  server 192.168.1.10:80;
  keepalive 64;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  proxy_http_version 1.1;

  # location で proxy_set_header を書くと server の分は引き継がれないので、各 location に書く
  # 画像（/api/images/）も s1 で処理する（下の /api/images/ で s1 の nginx に送る）。セッションもリージョンも見ないので X-Isureal-Region は付いても使われない。
  # ここのアプリはフィードを返さないので created_at を知らず、初期画像のディスクの写しもない。そのため毎回 id だけの
  # 重い問い合わせ（50 パーティションを引く）になり、約半分は本体も s4 から読んでいた。s1 は両方持っている。
  # リージョン間を通るバイト数は、s4 からの未キャッシュ分（ベンチ1回 約140MB）から全レスポンス（約174MB）に増える
  # s1 からの画像の署名の依頼（#48）
  location /api/internal/ {
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://app;
  }

  location = /api/notifications {
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Region america;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_pass http://s1app;
  }

  location /api/images/ {
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://s1nginx;
  }

  location /api/ {
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Region america;
    proxy_pass http://s1app;
  }

  location /assets/ {
    expires 1y;
  }

  location / {
    try_files $uri /index.html;
  }
}
