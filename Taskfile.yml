version: '3'

vars:
  # ===== 当日に問題に合わせて書き換える =====
  APP_DIR: $HOME/webapp/go
  APP_BIN: isureal
  APP_SERVICE: isureal-go.service
  GO: $HOME/local/go/bin/go
  # ==========================================
  SERVER_ID:
    sh: cat ~/.server_id 2>/dev/null || true
  NGINX_LOG: /var/log/nginx/access.log
  SLOW_LOG: /var/log/postgresql/postgresql-16-main.log
  # PostgreSQL を動かしているサーバー (s4) だけ 1 になる
  PG_ENABLED:
    sh: systemctl is-enabled postgresql >/dev/null 2>&1 && echo 1 || true
  # perl 製の psql ラッパーを通すと ssh 元の LC_CTYPE で locale の警告が出るので本体を直接呼ぶ
  PSQL: sudo -u postgres /usr/lib/postgresql/16/bin/psql -X -q -d postgres

tasks:
  default:
    cmds:
      - task --list

  collect:
    desc: サーバーの状況を <SERVER_ID>/collect.md にまとめる (Claude に読ませる用)
    preconditions: &need_server_id
      - sh: test -n "{{.SERVER_ID}}"
        msg: "SERVER_ID 未設定 (先に ./scripts/setup.sh s1)"
    cmds:
      - ./scripts/collect.sh {{.SERVER_ID}}

  get-conf:
    desc: サーバーの /etc 設定と、アプリの環境変数ファイル (systemd の EnvironmentFile) を repo に取り込む
    preconditions: *need_server_id
    cmds:
      - mkdir -p {{.SERVER_ID}}/etc
      - for d in nginx mysql; do if [ -d /etc/$d ]; then sudo cp -r /etc/$d {{.SERVER_ID}}/etc/; fi; done
      # PostgreSQL はアプリ機にも入っているので、動かしているサーバーだけ取り込む
      - if systemctl is-enabled postgresql >/dev/null 2>&1; then sudo cp -r /etc/postgresql {{.SERVER_ID}}/etc/; fi
      - mkdir -p {{.SERVER_ID}}/etc/systemd/system && cp /etc/systemd/system/isureal-*.service {{.SERVER_ID}}/etc/systemd/system/
      # ホーム配下の EnvironmentFile (例: ~/env.sh) を <SERVER_ID>/home/ に取り込む。deploy で書き戻す
      - |
        units=$(systemctl list-unit-files --no-legend | awk '{print $1}' | grep -i isu || true)
        [ -n "$units" ] || exit 0
        for f in $(systemctl show -p EnvironmentFiles $units | sed -E 's/^EnvironmentFiles=-?//; s/ \(.*//' | sort -u); do
          case "$f" in
            "$HOME"/*) rel=${f#"$HOME"/}; mkdir -p "{{.SERVER_ID}}/home/$(dirname "$rel")"; cp "$f" "{{.SERVER_ID}}/home/$rel"; echo "取り込み: $f";;
          esac
        done
      - sudo chown -R $(id -un):$(id -gn) {{.SERVER_ID}}

  deploy:
    desc: pull → 設定反映 → ビルド → 再起動 → ログを空に
    cmds:
      - git pull
      - task: deploy-conf
      - task: build
      - task: restart
      - task: bench-prep

  deploy-conf:
    preconditions: *need_server_id
    cmds:
      - |
        set -e
        # 変わった PostgreSQL の設定ファイルを restart に渡す (reload で済むか判断する)
        rm -f /tmp/pg-conf-changed
        if [ -d {{.SERVER_ID}}/etc/postgresql ]; then
          (cd {{.SERVER_ID}}/etc && find postgresql -type f) | while read -r f; do
            sudo cmp -s "{{.SERVER_ID}}/etc/$f" "/etc/$f" || echo "$f" >> /tmp/pg-conf-changed
          done
        fi
        for d in nginx mysql postgresql sysctl.d systemd; do
          if [ -d {{.SERVER_ID}}/etc/$d ]; then sudo cp -r {{.SERVER_ID}}/etc/$d/. /etc/$d/; fi
        done
        if [ -d {{.SERVER_ID}}/etc/sysctl.d ]; then sudo sysctl --system >/dev/null; fi
        if [ -d {{.SERVER_ID}}/home ]; then cp -r {{.SERVER_ID}}/home/. "$HOME"/; fi
        sudo systemctl daemon-reload

  build:
    cmds:
      - cd {{.APP_DIR}} && {{.GO}} build -o {{.APP_BIN}} ./cmd/isureal

  restart:
    desc: enabled なサービスだけ再起動 (DB専用機ではアプリを disable しておく)
    cmds:
      - |
        set -e
        if systemctl is-enabled nginx >/dev/null 2>&1; then sudo nginx -t; fi
        # 再起動はベンチ中の接続を切るので、PostgreSQL は reload で反映できない設定 (pending_restart) があるときだけ再起動する
        # (go-task の shell は if の中の continue で if の残りを実行してしまうので、先に決めておく)
        pg=restart
        if [ -n "{{.PG_ENABLED}}" ] && systemctl is-active -q postgresql; then
          pg=keep
          if [ -e /tmp/pg-conf-changed ]; then
            # environment / start.conf / pg_ctl.conf の変更は pending_restart に出ない
            if grep -qvE '/(postgresql|pg_hba|pg_ident)\.conf$|/conf\.d/' /tmp/pg-conf-changed; then
              pg=restart
            else
              task pg-reload
              if [ "$({{.PSQL}} -At -c 'SELECT count(*) FROM pg_settings WHERE pending_restart')" != 0 ]; then pg=restart; fi
            fi
          fi
        fi
        for s in nginx mysql postgresql {{.APP_SERVICE}}; do
          systemctl is-enabled $s >/dev/null 2>&1 || continue
          if [ $s = postgresql ] && [ $pg = keep ]; then continue; fi
          sudo systemctl restart $s
        done
        rm -f /tmp/pg-conf-changed

  pg-reload:
    desc: s4 で実行。PostgreSQL の設定を再起動せずに反映する (再起動が要る設定は pending_restart として表示)
    cmds:
      - |
        set -e
        if [ -z "{{.PG_ENABLED}}" ]; then exit 0; fi
        {{.PSQL}} -c 'SELECT pg_reload_conf()' >/dev/null
        # pg_reload_conf() は SIGHUP を送るだけで、postmaster が読み直すのを待たない
        sleep 1
        errors=$({{.PSQL}} -At -c "SELECT f.sourcefile || ':' || f.sourceline || ': ' || coalesce(f.name || ': ', '') || f.error FROM pg_file_settings f LEFT JOIN pg_settings s ON s.name = lower(f.name) WHERE f.error IS NOT NULL AND NOT coalesce(s.pending_restart, false)")
        if [ -n "$errors" ]; then
          echo "PostgreSQL の設定に誤りがあり、反映されていない:" >&2
          echo "$errors" >&2
          exit 1
        fi
        {{.PSQL}} -At -c "SELECT 'pending_restart (反映には再起動が必要): ' || name FROM pg_settings WHERE pending_restart"

  bench-prep:
    desc: ベンチ前にログと pg_stat_statements を空にする
    cmds:
      - |
        set -e
        for f in {{.NGINX_LOG}} {{.SLOW_LOG}}; do
          # -c (O_CREAT なし) が必須: fs.protected_regular=2 だと sticky な /var/log/postgresql にある postgres 所有のログを root でも O_CREAT で開けない
          if sudo test -f "$f"; then sudo truncate -c -s 0 "$f"; fi
        done
      # 拡張は postgres DB に作る (task pgstat もここを見る。ビューはクラスタ全体の統計を返し、reset.sql は isureal しか触らない)
      - |
        if [ -n "{{.PG_ENABLED}}" ]; then
          {{.PSQL}} -v ON_ERROR_STOP=1 -c 'SET client_min_messages = warning' -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements' -c 'SELECT pg_stat_statements_reset()' >/dev/null
        fi

  analyze:
    desc: ベンチ後に集計。s1〜s3 は alp (/tmp/alp.txt)、s4 は pg_stat_statements (/tmp/pgstat.txt)。ログからのクエリ集計は s4 で task slp
    cmds:
      - task: alp
      - task: pgstat

  pgstat:
    desc: s4 で実行。クエリを合計実行時間順に一覧 (calls、平均 ms、1回あたりの行数、キャッシュヒット率、ディスク読み込み秒)
    cmds:
      - |
        if [ -z "{{.PG_ENABLED}}" ]; then exit 0; fi
        set -o pipefail
        {{.PSQL}} -v ON_ERROR_STOP=1 < scripts/pgstat.sql | tee /tmp/pgstat.txt

  alp:
    desc: アクセスログをエンドポイントごとに合計時間順で一覧
    cmds:
      # alp 1.0.21 は --config を付けると結果が空になるので、設定は引数で渡す。パスのまとめ方は scripts/alp-groups.txt
      - sudo alp json --file {{.NGINX_LOG}} --restime-key reqtime --sort sum -r -o count,2xx,4xx,5xx,method,uri,max,sum,avg,p99 -m "$(paste -sd, scripts/alp-groups.txt)" | tee /tmp/alp.txt

  slp:
    desc: s4 で実行。クエリ別の合計時間を一覧 (平均が大きいものはインデックスかロック待ちを疑う)
    cmds:
      - sudo python3 -I scripts/pgslow.py {{.SLOW_LOG}} | cut -c1-300 | tee /tmp/slp.txt

  monitor:
    desc: ベンチ開始直前に実行。CPU・メモリを1秒ごとに記録して /tmp/resource.txt に要約 (秒数は D=90 で変更)
    cmds:
      - ./scripts/monitor.sh {{.D | default 75}}

  locks:
    desc: s4 でベンチ開始直前に実行。ロック待ちを0.5秒ごとに記録し、待たせている側の接続元・状態・クエリで /tmp/locks.txt に要約 (秒数は D=90 で変更)
    cmds:
      - ./scripts/locks.sh {{.D | default 75}}

  pprof:
    desc: ベンチ開始直前に実行 → 手元のブラウザで localhost:1080
    interactive: true
    cmds:
      - go tool pprof -http=0.0.0.0:1080 "http://localhost:6060/debug/pprof/profile?seconds=60"

  pprof-save:
    desc: 'ベンチ中に ssh 越しで実行 (対話なし): CPU プロファイルを /tmp/cpu.pprof、上位関数を /tmp/pprof.txt に保存。秒数は SEC=60'
    cmds:
      - curl -sf -o /tmp/cpu.pprof "http://localhost:6060/debug/pprof/profile?seconds={{.SEC | default 60}}"
      # バイナリを渡すとシンボルが確実に解決される
      - |
        {
          {{.GO}} tool pprof -top -nodecount=50 {{.APP_DIR}}/{{.APP_BIN}} /tmp/cpu.pprof
          echo; echo '# cumulative'
          {{.GO}} tool pprof -top -cum -nodecount=60 {{.APP_DIR}}/{{.APP_BIN}} /tmp/cpu.pprof
        } > /tmp/pprof.txt 2>&1
      - head -60 /tmp/pprof.txt

  score:
    desc: 'ポータルで結果を見てから: task score S=12345 M="メモ" → ~/scores.log に追記'
    requires:
      vars: [S]
    cmds:
      # git には入れない (サーバーから push すると他の人の push と衝突するため)
      - |
        line="$(date +%H:%M) {{.SERVER_ID}} score={{.S}} $(git log -1 --format='%h %s') {{.M}}"
        echo "$line" >> ~/scores.log
        echo "$line"
