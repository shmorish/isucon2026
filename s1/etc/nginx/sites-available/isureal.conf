upstream app {
  server 127.0.0.1:8080;
  keepalive 64;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  # アップロード（投稿 約460KB、ベンチ1回 約3,300件）を /var/lib/nginx/body の一時ファイルに書かず、メモリに置く。
  # 既定の 16KB を超える body はすべてディスクに書かれていた（s1 の iowait 最大 52%）
  client_body_buffer_size 8m;
  root /home/isucon/webapp/public;

  proxy_http_version 1.1;

  # location で proxy_set_header を書くと server の分は引き継がれないので、各 location に書く。
  # X-Isureal-Region は s2・s3 から転送されたリクエストのリージョン。クライアントの値は asia で上書きする
  location = /api/notifications {
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Region asia;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_pass http://app;
  }

  # エクスポートの zip（1件 約1.75MB）を /var/lib/nginx/proxy の一時ファイルに書かず、そのまま流す。アプリは少しずつ送っている
  location = /api/me/export {
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Region asia;
    proxy_buffering off;
    proxy_pass http://app;
  }

  # X-Isureal-Image-Accel はこの nginx を通ったことの印。アプリはこれと送り元 127.0.0.1 の両方があるときだけ
  # 画像を X-Accel-Redirect で返す（fromLocalNginx）。クライアントの値は 1 で上書きする。
  # s2・s3 の nginx はここを通らず :8080 に直接来るので、画像の本体をアプリが返す
  location /api/ {
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Region asia;
    proxy_set_header X-Isureal-Image-Accel 1;
    proxy_pass http://app;
  }

  # アプリが署名・公開範囲・削除を確認したあとの画像ファイル（imageAccelPath、#76）。
  # Content-Type と Cache-Control: no-store はアプリの応答のものがそのまま返る。
  # 今までの応答にない ETag・Last-Modified・Range（206）は付けない
  location /_image_cache/ {
    internal;
    alias /home/isucon/image-cache/;
    sendfile on;
    etag off;
    max_ranges 0;
    add_header Last-Modified "";
  }

  location /assets/ {
    expires 1y;
  }

  location / {
    try_files $uri /index.html;
  }
}
