upstream app {
  server 127.0.0.1:8080;
  keepalive 64;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  proxy_http_version 1.1;

  # location で proxy_set_header を書くと server の分は引き継がれないので、各 location に書く。
  # X-Isureal-Region は s2・s3 から転送されたリクエストのリージョン。クライアントの値は asia で上書きする
  location = /api/notifications {
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Region asia;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_pass http://app;
  }

  location /api/ {
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Region asia;
    proxy_pass http://app;
  }

  location /assets/ {
    expires 1y;
  }

  location / {
    try_files $uri /index.html;
  }
}
